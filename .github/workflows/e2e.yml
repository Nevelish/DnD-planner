name: End-to-end tests

"on":
  pull_request:
  push:
    branches: [main]
  workflow_dispatch: {}

permissions:
  contents: read

# A newer push to the same branch or PR cancels a run that's still going.
concurrency:
  group: e2e-${{ github.ref }}
  cancel-in-progress: true

jobs:
  e2e:
    runs-on: ubuntu-latest
    # A normal run takes about 10 minutes; don't let a hung step sit for hours.
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: dnd
          POSTGRES_PASSWORD: dnd
          POSTGRES_DB: dnd_planner_e2e
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U dnd"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      E2E_DATABASE_URL: postgresql://dnd:dnd@localhost:5432/dnd_planner_e2e
      DATABASE_URL: postgresql://dnd:dnd@localhost:5432/dnd_planner_e2e
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Install Chromium for Playwright, and psql for test fixtures
        run: |
          npx playwright install --with-deps chromium
          command -v psql || (sudo apt-get update && sudo apt-get install -y postgresql-client)

      - name: Lint
        run: npm run lint

      - name: Build
        run: |
          npx prisma generate
          npm run build

      - name: Run end-to-end tests
        run: npm run test:e2e

      - name: Upload test report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 7
