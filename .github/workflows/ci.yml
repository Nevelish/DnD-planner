name: CI

# Pull requests: run the end-to-end tests.
# Pushes to main (and manual runs on main): run the tests, and only if they
# pass, build and publish the Docker image that TrueNAS pulls.
"on":
  pull_request:
  push:
    branches: [main]
  workflow_dispatch: {}

permissions:
  contents: read

# A newer push to the same branch or PR cancels a run that's still going. On
# main that also means an older build can never finish last and overwrite
# :latest with an older image.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  e2e:
    name: e2e
    runs-on: ubuntu-latest
    # A normal run takes about 5 minutes; don't let a hung step sit for hours.
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: dnd
          POSTGRES_PASSWORD: dnd
          POSTGRES_DB: dnd_planner_e2e
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U dnd"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      E2E_DATABASE_URL: postgresql://dnd:dnd@localhost:5432/dnd_planner_e2e
      DATABASE_URL: postgresql://dnd:dnd@localhost:5432/dnd_planner_e2e
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Install Chromium for Playwright, and psql for test fixtures
        run: |
          npx playwright install --with-deps chromium
          command -v psql || (sudo apt-get update && sudo apt-get install -y postgresql-client)

      - name: Lint
        run: npm run lint

      - name: Build
        run: |
          npx prisma generate
          npm run build

      - name: Run end-to-end tests
        run: npm run test:e2e

      - name: Upload test report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 7

  publish:
    name: Publish Docker image
    needs: e2e
    # Only from main, never for pull requests.
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    # A normal build takes 3-10 minutes. Without this, a hung step (e.g. a
    # stalled npm download) would sit for GitHub's default of 6 hours.
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # GHCR image names must be lowercase; the repo is DnD-planner (mixed case).
      - name: Compute image name
        id: image
        run: echo "name=ghcr.io/$(echo '${{ github.repository }}' | tr '[:upper:]' '[:lower:]')" >> "$GITHUB_OUTPUT"

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/Dockerfile
          push: true
          platforms: linux/amd64
          tags: |
            ${{ steps.image.outputs.name }}:latest
            ${{ steps.image.outputs.name }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
